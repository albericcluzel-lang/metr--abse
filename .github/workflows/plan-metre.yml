# Vérifie l'appli « plan-metre » et la publie sur GitHub Pages
# (https://<compte>.github.io/metr--abse/, branche gh-pages) à chaque mise à jour de main.
name: Appli Plan & Métré

on:
  push:
    branches: [main]
    paths: ['plan-metre/**', '.github/workflows/plan-metre.yml']
  pull_request:
    paths: ['plan-metre/**', '.github/workflows/plan-metre.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-metre-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plan-metre
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plan-metre/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Tests dans le navigateur
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

  publier:
    needs: verifier
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: plan-metre
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plan-metre/package-lock.json
      - run: npm ci
      - run: npm run build
      # Publication sur la branche gh-pages (servie par GitHub Pages).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: plan-metre/dist
          publish_branch: gh-pages
          enable_jekyll: false
          commit_message: Publication de l'appli Plan & Métré
